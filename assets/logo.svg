<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="50%" stop-color="#00A3FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="streamGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="hexBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="hexFillGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.98" />
    </linearGradient>
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="packetGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- eBPF Kernel Hexagonal Core Container -->
  <!-- Center: 500, 500; Radius: 380 -->
  <!-- Angles: 30, 90, 150, 210, 270, 330 deg -->
  <!-- Coordinates:
       30:  500 + 380*cos(30) = 500 + 329.1 = 829, 500 + 380*sin(30) = 500 + 190 = 690
       90:  500, 500 + 380 = 880
       150: 500 - 329 = 171, 690
       210: 171, 310
       270: 500, 120
       330: 829, 310
  -->
  <polygon points="500,120 829,310 829,690 500,880 171,690 171,310" 
           fill="url(#hexFillGrad)" 
           stroke="url(#hexBorderGrad)" 
           stroke-width="12" 
           stroke-linejoin="round" />

  <!-- Inner Hexagonal Circuit Grid -->
  <polygon points="500,165 790,332 790,668 500,835 210,668 210,332" 
           fill="none" 
           stroke="#00F5FF" 
           stroke-width="2.5" 
           stroke-dasharray="16,16" 
           opacity="0.35" />

  <!-- Kernel Packet Flow Vector Stream A (Ingress Fast-Path: NW to SE) -->
  <path d="M 270,270 C 400,400 600,600 730,730" 
        stroke="url(#streamGrad1)" 
        stroke-width="54" 
        stroke-linecap="round" 
        fill="none" 
        filter="url(#coreGlow)" />
  <path d="M 270,270 C 400,400 600,600 730,730" 
        stroke="#E0F2FE" 
        stroke-width="16" 
        stroke-linecap="round" 
        fill="none" />

  <!-- Kernel Packet Flow Vector Stream B (Egress Reverse-Path: SW to NE) -->
  <!-- Split into two segments to simulate 3D pipeline crossover with zero-copy interception -->
  <path d="M 270,730 L 430,570" 
        stroke="url(#streamGrad2)" 
        stroke-width="54" 
        stroke-linecap="round" 
        fill="none" 
        filter="url(#coreGlow)" />
  <path d="M 270,730 L 430,570" 
        stroke="#E0F2FE" 
        stroke-width="16" 
        stroke-linecap="round" 
        fill="none" />

  <path d="M 570,430 L 730,270" 
        stroke="url(#streamGrad2)" 
        stroke-width="54" 
        stroke-linecap="round" 
        fill="none" 
        filter="url(#coreGlow)" />
  <path d="M 570,430 L 730,270" 
        stroke="#E0F2FE" 
        stroke-width="16" 
        stroke-linecap="round" 
        fill="none" />

  <!-- Central Telemetry Intersection Core (eBPF LRU Map Aggregator) -->
  <polygon points="500,450 550,500 500,550 450,500" 
           fill="#00F5FF" 
           stroke="#FFFFFF" 
           stroke-width="6" 
           filter="url(#coreGlow)" />

  <!-- Flow Particle / Packet Telemetry Nodes -->
  <circle cx="340" cy="340" r="10" fill="#FFFFFF" filter="url(#packetGlow)" />
  <circle cx="660" cy="660" r="10" fill="#FFFFFF" filter="url(#packetGlow)" />
  <circle cx="340" cy="660" r="10" fill="#FFFFFF" filter="url(#packetGlow)" />
  <circle cx="660" cy="340" r="10" fill="#FFFFFF" filter="url(#packetGlow)" />

  <!-- Terminal Arrowheads (High-speed egress vectors) -->
  <polygon points="705,755 765,730 730,670" fill="#38BDF8" />
  <polygon points="730,330 765,270 705,245" fill="#00F5FF" />
</svg>
